name:  Snake

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: space-rock-0
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_background=0A101F&color_snake=10B981&color_dots=3B1F6B,5B21B6,7C3AED,A78BFA
            dist/snake-light.svg?palette=github-light&color_background=ffffff&color_snake=7C3AED&color_dots=DDD6FE,C4B5FD,A78BFA,7C3AED

      - name: Publish snake SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
