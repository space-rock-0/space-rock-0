```yaml
name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: space-rock-0
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_dots=2d3343,0e4429,006d32,26a641,39d353&color_snake=A78BFA
            dist/snake-light.svg?palette=github-light&color_dots=eff2f5,9be9a8,40c463,30a14e,216e39&color_snake=10B981

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
